# Honeydew behind nginx (README "Web"). The site folder is dist/ after tools/web-dist.sh, or the release zip's folder.
# Put this server block in nginx.conf's http { }, with your path and port.
server {
    listen 8080;
    root /srv/honeydew;

    # The types the site serves (this map replaces mime.types in this server).
    types {
        text/html html;
        text/javascript js;
        application/json json;
        application/wasm wasm;
        application/x-tar tar;
        application/gzip gz;
        text/plain txt;
        image/png png;
    }
    charset utf-8;
    charset_types text/javascript application/json text/plain; # and text/html, always

    # Precompressed: a request for x is answered from x.gz with Content-Encoding: gzip when the client accepts gzip,
    # and from x otherwise. The wasm and the packs are fetched as their .gz, which goes out as it is (application/gzip)
    # and is gunzipped in the browser. Only JSON and text without a .gz beside them are compressed on the fly.
    gzip_static on;
    gzip_vary on;
    gzip on;
    gzip_types application/json text/plain;

    # Names that stay across releases revalidate; Trunk's wasm and JS and the packs are named by their content.
    add_header Cache-Control "no-cache";
    location ~ \.(wasm|js)(\.gz)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /content/p/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

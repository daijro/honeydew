[package]
name = "os-vst2"
description = "Lemon Studio's VST 2 plugin host (clean-room interface, no Steinberg SDK)"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
libloading = "0.8"
os-engine = { path = "../os-engine" }
os-host = { path = "../os-host" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

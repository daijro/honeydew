[package]
name = "os-host"
description = "Lemon Studio's format-neutral plugin hosting layer (CLAP, VST3 and native backends implement it)"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
os-engine = { path = "../os-engine" }

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

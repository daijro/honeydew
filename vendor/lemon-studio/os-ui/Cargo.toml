[package]
name = "os-ui"
description = "Lemon Studio painting primitives: shapes and text on a CPU canvas"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
os-theme = { path = "../os-theme" }
tiny-skia = "0.11"
fontdue = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
swash = "0.2"

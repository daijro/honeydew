[package]
name = "os-engine"
description = "Honeydew's subset of Lemon Studio's audio engine: the types the plugin hosts need"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
# What Lemon Studio's own plugins use from the engine (`vendor/lemon-studio/README.md`).
plugins = ["dep:os-model", "dep:os-dsp", "dep:thiserror", "dep:symphonia", "dep:symphonia-codec-wavpack"]

[dependencies]
os-model = { path = "../os-model", optional = true }
os-dsp = { path = "../os-dsp", optional = true }
thiserror = { version = "2", optional = true }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "ogg", "vorbis", "mp3", "aiff", "id3v1", "id3v2"], optional = true }
symphonia-codec-wavpack = { version = "0.1", optional = true }

# What only upstream's engine, which is not carried, reads.
[lints.rust]
dead_code = "allow"

[package]
name = "banana-small-fx"
description = "Banana Studio's small effects (Banana Soft Clipper, Banana Fast Distortion, Banana Balance, Banana Stereo Enhancer, Banana Transient Processor, Banana Chorus, Banana Stereo Shaper, Banana Filter, Banana Flanger, Banana Phaser): the plugin, parameters and editor they share"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
doctest = false

[features]
# BanaForge (vendored addition): the editor draws into BanaForge's own window (`os-plugkit`'s `embed`).
embed = ["os-plugkit/embed", "os-hostlink/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
os-dsp = { path = "../os-dsp" }
os-engine = { path = "../os-engine", features = ["plugins"] }
os-hostlink = { path = "../os-hostlink" }
os-plugkit = { path = "../os-plugkit" }
os-ui = { path = "../os-ui" }
os-theme = { path = "../os-theme" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_System_LibraryLoader"] }

# Upstream allows a lint that Rust 1.91 (BanaForge's CI) does not know yet; with `embed` the Win32 editor goes unused on
# Windows.
[lints.rust]
unknown_lints = "allow"
dead_code = "allow"

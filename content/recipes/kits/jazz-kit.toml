# A jazz kit: Virtuosity Drums (48 kHz, resampled), one mid-strong hit per pad, its kick mic, snare mic and overheads
# summed at unity, as the source's basic kit plays them (bleed on). Each pad peaks at −1 dBFS and is cut at −60 dB re
# its peak or 4 s, with a 400 ms fade; Level and Pan follow the Rock Kit's mix.
id = "kit-jazz"
kind = "kit"
path = "Drumsets/Jazz Kit.tmpl"
source = "virtuosity-drums"
tail = { floor_db = -60, fade_ms = 400, max_s = 4 }


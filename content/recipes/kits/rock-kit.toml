# A rock kit: Karoryfer's Big Rusty Drums, one strong (not the hardest) hit per pad, its close mic and overheads
# premixed at the source's own default mic balance (the kick adds a little overhead). Each pad peaks at −1 dBFS and is
# cut at −60 dB re its peak or 5 s; Level and Pan follow the code-made kits' mix (`src/content/kits.rs`).
id = "kit-rock"
kind = "kit"
path = "Drumsets/Rock Kit.tmpl"
source = "karoryfer-big-rusty-drums"
tail = { floor_db = -60, fade_ms = 300, max_s = 5 }

[[pad]]
name = "Kick"
level_db = -7
mix = [
  { file = "unpacked/karoryfer.big-rusty-drums-main/Samples/kick_24/kick/kick/k_vl12_rr1.flac" },
  { file = "unpacked/karoryfer.big-rusty-drums-main/Samples/kick_24/kick/oh/k_vl12_rr1.flac", gain_db = -12 },
]

[[pad]]
name = "Snare"
level_db = -8.5
mix = [
  { file = "unpacked/karoryfer.big-rusty-drums-main/Samples/snare_14/center/btm/sn_center_vl8_rr1.flac" },
  { file = "unpacked/karoryfer.big-rusty-drums-main/Samples/snare_14/center/top/sn_center_vl8_rr1.flac", gain_db = -8 },
  { file = "unpacked/karoryfer.big-rusty-drums-main/Samples/snare_14/center/oh/sn_center_vl8_rr1.flac", gain_db = -4.4 },
]


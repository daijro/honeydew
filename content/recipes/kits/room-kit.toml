# A room kit: Karoryfer's Swirly Drums (kick, toms, cymbals: its dry mic plus its "wet" ambience 10 dB down),
# Frankensnare's 14x5 maple snare and aluminium rimshot (bottom, top and overheads at the source's default balance) and
# The Hat With The Phat (one stereo pair). One mid-strong hit per pad, peaking at −1 dBFS, cut at −60 dB re its peak or
# 4 s with a 400 ms fade; Level and Pan follow the Rock Kit's mix.
id = "kit-room"
kind = "kit"
path = "Drumsets/Room Kit.tmpl"
source = "karoryfer-swirly-drums"
tail = { floor_db = -60, fade_ms = 400, max_s = 4 }

[[pad]]
name = "Kick"
level_db = -7
mix = [
  { file = "unpacked/karoryfer.swirly-drums-main/Samples/marching_kick/marching_kick_vl16_rr1_reso.wav" },
  { file = "unpacked/karoryfer.swirly-drums-main/Samples/marching_kick/marching_kick_vl16_rr1_beater.wav", gain_db = -3.1 },
  { file = "unpacked/karoryfer.swirly-drums-main/Samples/wet/marching_kick/marching_kick_vl16_rr1_reso.wav", gain_db = -10 },
]


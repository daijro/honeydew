# Sound effects for the sample pickers: 30 of Kenney's game sounds (sci-fi, digital, impacts, interface, RPG), which
# ship as Ogg only, decoded to FLAC. Mono where the source is (a pair with L = R folds); each peaks at −1 dBFS and is
# cut at −60 dB re its peak (3 s at most) with a 10 ms fade (a blip keeps its envelope).
id = "sfx"
kind = "samples"
path = "Samples/SFX/"
source = "kenney-sci-fi-sounds"
tail = { floor_db = -60, fade_ms = 10, max_s = 3 }


# Retro 8-bit sound effects for the sample pickers: 20 from Juhani Junkala's 512 Sound Effects (mono 16-bit WAV).
# Each peaks at −1 dBFS and is cut at −60 dB re its peak (3 s at most) with a 10 ms fade (a blip keeps its envelope).
id = "sfx-retro"
kind = "samples"
path = "Samples/Retro SFX/"
source = "oga-512-sfx-8bit"
tail = { floor_db = -60, fade_ms = 10, max_s = 3 }


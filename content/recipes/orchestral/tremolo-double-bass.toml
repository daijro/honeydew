# VSCO 2 CE: tremolo double bass, all recorded sample points and the first round robin.
# The soft B2 sample swells at 3.3 s, so keep 5.5 s to fit a full tremolo loop after its onset.
# Measured pitch requires transpose 12; retain both dynamics.
id = "strings-tremolo-double-bass"
kind = "program"
path = "Presets/DW Sampler/Orchestral/Tremolo Double Bass.dwp"
source = "vsco2-ce"
files = "unpacked/VSCO-2-CE-master/Strings/Solo Contrabass/Trem/BKCtbss_Trem_{note}_v{layer}_rr{rr}.wav"
layers = ["1", "2"]
transpose = 12
velocity_layers = [1, 2]
channels = "auto"
loop = { find = true, min_s = 1.5, crossfade_ms = 150, keep_s = 5.5 }
release = 0.4
gain = "normalize"

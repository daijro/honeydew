# VSCO 2 CE: tremolo cellos, all recorded sample points and the first round robin.
# Measured pitch requires transpose 12; retain both dynamics.
# The file trem_B2_v2 sounds B2 (123 Hz), matching trem_B1_v1; its root corrects that filename.
# A pitch with only one recorded dynamic uses it across velocity, avoiding distant-layer pitch stretching.
id = "strings-tremolo-cellos"
kind = "program"
path = "Presets/DW Sampler/Orchestral/Tremolo Cellos.dwp"
source = "vsco2-ce"
channels = "auto"
loop = { find = true, min_s = 1.5, crossfade_ms = 150, keep_s = 4.0 }
release = 0.4
gain = "normalize"

[[zone]]
file = "unpacked/VSCO-2-CE-master/Strings/Cello Section/trem/trem_E1_v1_1.wav"
root = 40
lokey = 39
hikey = 41
lovel = 0
hivel = 63


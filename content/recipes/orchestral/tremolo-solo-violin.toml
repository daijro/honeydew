# VSCO 2 CE: tremolo solo violin, all recorded sample points and the first round robin.
# Measured pitch requires transpose 12; retain both dynamics.
# A pitch with only one recorded dynamic uses it across velocity, avoiding distant-layer pitch stretching.
id = "strings-tremolo-solo-violin"
kind = "program"
path = "Presets/DW Sampler/Orchestral/Tremolo Solo Violin.dwp"
source = "vsco2-ce"
files = "unpacked/VSCO-2-CE-master/Strings/Solo Violin/Trem/LLVln_trem_{note}_v{layer}_rr{rr}.wav"
layers = ["1", "2"]
transpose = 12
channels = "auto"
loop = { find = true, min_s = 1.5, crossfade_ms = 150, keep_s = 4.0 }
release = 0.4
gain = "normalize"

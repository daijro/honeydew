# Timpani: VSCO 2 CE's five drums, hit, layers 1 and 3 (p, f), first round robin, each cut at −50 dB re its peak or
# 4 s. The files name no note: each root is the drum's principal tone (its strongest partial, with others near 1.5 and
# 2 times it), measured by FFT, and `tune` brings it to the root.
id = "orchestral-timpani"
kind = "program"
path = "Presets/DW Sampler/Orchestral/Timpani.dwp"
source = "vsco2-ce"
tail = { floor_db = -50, fade_ms = 300, max_s = 4.0 }
release = 0.6
gain = "even"

[[zone]]
file = "unpacked/VSCO-2-CE-master/Percussion/Timpani/Timpani1_Hit_v1_rr1_Sum.wav"
root = 41
tune = -47
lokey = 36
hikey = 44
lovel = 0
hivel = 63


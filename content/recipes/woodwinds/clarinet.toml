# A clarinet: VSCO 2 CE's long sustain, layers 1 and 3 (p, f), one point per minor third or more, folded to mono (its
# side mostly sits 5–20 dB under its mid), each cut to 2.5 s with a found loop.
id = "woodwinds-clarinet"
kind = "program"
path = "Presets/DW Sampler/Woodwinds/Clarinet.dwp"
source = "vsco2-ce"
files = "unpacked/VSCO-2-CE-master/Woodwinds/Clarinet/susLong/DCClar_susLong_{note}_v{layer}_rr{rr}_sum.wav"
layers = ["1", "3"]
transpose = 12
keys = { every = 3 }
channels = "mono"
loop = { find = true, min_s = 1.0, crossfade_ms = 100, keep_s = 2.5 }
release = 0.3
gain = "normalize"

# Voice Oohs: MuseScore_General's GM Voice Oohs (mono sampled voices from FluidR3, MIT), rendered through the SoundFont
# Player at its seven sample roots (one per tritone), each cut to 2.2 s with a found loop.
id = "choir-voice-oohs"
kind = "program"
path = "Presets/DW Sampler/Choir/Voice Oohs.dwp"
source = "musescore-general"
sf2 = { file = "unpacked/MuseScore_General.sf2", preset = 53, keys = [48, 54, 60, 66, 72, 78, 84] }
loop = { find = true, min_s = 1.0, crossfade_ms = 100, keep_s = 2.2 }
release = 0.6
gain = "normalize"

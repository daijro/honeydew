# An electronic kit whose pads are synthesized: an analog machine with a long sub kick and tuned toms.
id = "kit-voltage"
kind = "kit"
path = "Drumsets/Voltage Kit.tmpl"
source = "honeydew"

[[pad]]
name = "Kick"
level_db = -7
render = "kick"
params = { tune = 46.0, hold = 0.08, decay = 0.6, sub = 0.7, drive = 2.0 }

[[pad]]
name = "Snare"
level_db = -8.5
render = "snare"
params = { tune = 180.0, decay = 0.09, snappy = 0.8, rattle = 0.22 }

[[pad]]
name = "Clap"
level_db = -10
pan = -0.08
render = "clap"
params = { tone = 1000.0, decay = 0.2, spread = 0.014 }

[[pad]]
name = "Closed Hat"
level_db = -13
pan = 0.24
render = "hat"
params = { tune = 300.0, tone = 7500.0, decay = 0.05 }

[[pad]]
name = "Open Hat"
level_db = -12
pan = 0.24
render = "hat"
params = { tune = 300.0, tone = 7500.0, decay = 0.4 }

[[pad]]
name = "Low Tom"
level_db = -9
pan = -0.24
render = "tom"
params = { tune = 80.0, bend = 2.0, decay = 0.35, noise = 0.05 }

[[pad]]
name = "Mid Tom"
level_db = -9
render = "tom"
params = { tune = 115.0, bend = 2.0, decay = 0.3, noise = 0.05 }

[[pad]]
name = "High Tom"
level_db = -9
pan = 0.24
render = "tom"
params = { tune = 165.0, bend = 2.0, decay = 0.25, noise = 0.05 }

[[pad]]
name = "Clave"
level_db = -12
pan = 0.16
render = "clave"

[[pad]]
name = "Cowbell"
level_db = -12
pan = 0.12
render = "cowbell"
params = { tune = 540.0, decay = 0.2 }

[[pad]]
name = "Cymbal"
level_db = -12
pan = -0.28
render = "cymbal"
params = { tune = 230.0, tone = 5500.0, decay = 1.2 }

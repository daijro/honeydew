# An electronic kit whose pads are synthesized: short, dark and dusty, with a crackle bed.
id = "kit-static"
kind = "kit"
path = "Drumsets/Static Kit.tmpl"
source = "honeydew"

[[pad]]
name = "Kick"
level_db = -7
render = "kick"
params = { tune = 52.0, bend = 2.5, sweep = 0.02, decay = 0.15 }

[[pad]]
name = "Snare"
level_db = -8.5
render = "snare"
params = { tune = 175.0, decay = 0.08, snappy = 0.4, rattle = 0.2, tone = 3000.0 }

[[pad]]
name = "Rim"
level_db = -11
pan = -0.16
render = "rim"
params = { tune = 1200.0, decay = 0.03, click = 0.3 }

[[pad]]
name = "Closed Hat"
level_db = -13
pan = 0.24
render = "hat"
params = { tune = 280.0, tone = 6500.0, decay = 0.04 }

[[pad]]
name = "Open Hat"
level_db = -12
pan = 0.24
render = "hat"
params = { tune = 280.0, tone = 6500.0, decay = 0.25 }

[[pad]]
name = "Shaker"
level_db = -15
pan = 0.36
render = "hat"
params = { tone = 7000.0, noise = 2.0, decay = 0.06 }

[[pad]]
name = "Tom"
level_db = -9
render = "tom"
params = { tune = 100.0, decay = 0.2 }

[[pad]]
name = "Crackle"
level_db = -8
render = "crackle"
params = { length = 3.0 }

  { render = "hat", steps = "x.x. x.x. x.x. x.x.  x.x. x.x. x.xx x.x.", level = 0.4, pan = 0.25 },
  { render = "rim", steps = ".... .... ...x ....  .... .... .... ..x.", level = 0.5, pan = -0.3 },
]


# Sliced loops: synthesized one-shots on a 16th-note grid (tools/content-build/src/procedural/loops.rs). Each voice is
# { render, steps, level, pan, <model parameters> }; steps: `.` rest, `x` hit, `X` accent, spaces ignored. A loop must
# be a whole number of frames long at 44.1 kHz.
id = "proc-loops"
kind = "samples"
path = "Loops/"
source = "honeydew"
render = "loop"

[[variant]]
name = "Slow Haze 70"
bpm = 70
bars = 1
voice = [
  { render = "kick", tune = 50.0, decay = 0.35, steps = "X... .... ..x. ...." },
  { render = "snare", tune = 175.0, decay = 0.08, snappy = 0.4, rattle = 0.2, tone = 3000.0, steps = ".... X... .... X...", level = 0.8 },
  { render = "hat", decay = 0.04, tone = 6500.0, steps = "x.x. x.x. x.x. x.xx", level = 0.35, pan = 0.3 },
  { render = "crackle", length = 3.5, steps = "X... .... .... ....", level = 0.2 },
]

[[variant]]

# Hand percussion as a DW Sampler program: Virtuosity Drums' auxiliary percussion on its own General MIDI keys 60–84
# (bongos, congas, agogos, cabasa, shaker, whistles, guiros, claves, triangles, jingle bell, bell tree), close mic
# only, round robin 1, every source velocity layer (1–4 a key). Its snare-mic program maps nothing else in that span.
# One-shots cut at −60 dB re their peak (3 s at most); the loudest peaks at −6 dBFS; a 1.3 s release lets short notes
# ring out.
id = "hand-percussion"
kind = "program"
path = "Presets/DW Sampler/Percussion/Hand Percussion.dwp"
source = "virtuosity-drums"
tail = { floor_db = -60, fade_ms = 30, max_s = 3 }
gain = "normalize"
release = 0.6

# Explicit root-only zones keep unmapped GM keys silent. Velocity bands match the previous program.

[[zone]]
file = "unpacked/virtuosity_drums-master/Samples/perc/close/bongoh/BongoH_Hit1_v1_rr1_Close.wav"
root = 60
lovel = 0
hivel = 41


# Percussion one-shots for the sample pickers: hand drums and small percussion from the Versilian Community Sample
# Library (stereo pairs), Virtuosity Drums' vibraslap (close mic) and Karoryfer's Body Percussion (two claps and a snap;
# its other sounds are WAVE_FORMAT_EXTENSIBLE files the app's decoder refuses). Each peaks at −1 dBFS and is cut at
# −60 dB re its peak (3 s at most) with a 30 ms fade.
id = "percussion"
kind = "samples"
path = "Samples/Percussion/"
source = "vcsl"
tail = { floor_db = -60, fade_ms = 30, max_s = 3 }


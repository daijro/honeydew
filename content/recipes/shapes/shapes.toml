# 3x Osc custom shapes: 30 single cycles (600 frames, mono 16-bit) from Adventure Kid's AKWF-FREE, renamed to our own
# names. They join the six code-made shapes (`builtin_shapes`), which are our own designs; none of these names clash.
# Converted to FLAC whole, with no trim, peaking at −1 dBFS.
id = "shapes"
kind = "samples"
path = "Shapes/"
source = "akwf-free"


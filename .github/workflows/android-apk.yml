name: Android APK

# Build a testable debug APK on demand. Download it from the workflow run's Artifacts section;
# it installs beside the release app as Honeydew Debug.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOUNDS_TAG: v0.4.6

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      # The library the release of this version ships, unpacked where `tools/android-dist.sh` looks for it.
      - name: Sound library
        run: |
          mkdir -p target/android/assets
          url="https://github.com/daijro/honeydew/releases/download/$SOUNDS_TAG/honeydew-$SOUNDS_TAG-sounds.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/sounds.zip" "$url"
          unzip -q "$RUNNER_TEMP/sounds.zip" 'content/*' -x '*.gz' -d target/android/assets
          rm -f "$RUNNER_TEMP/sounds.zip"
      - name: Build the debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: tools/android-dist.sh
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: honeydew-android-apk-${{ github.sha }}
          path: target/honeydew-android-*-arm-debug.apk
          if-no-files-found: error
          retention-days: 14

name: fixup

# Temporary: runs the checks the `CI` workflow runs, writes their own output to `ci-report.txt`, formats the tree and
# commits both back to the branch, so that the machine writing this branch (no Rust toolchain, no crates.io) can read
# what the checks say. A push that touches this file runs it again. Delete this file and `ci-report.txt` once the branch
# is green.

on:
  push:
    branches: ["**"]
    paths:
      - .github/workflows/fixup.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: The checks' own output
        run: |
          {
            echo '# cargo fmt --check'
            cargo fmt --check 2>&1 || true
            echo
            echo '# cargo clippy --workspace --all-targets -- -D warnings'
            cargo clippy --workspace --all-targets -- -D warnings 2>&1 || true
            echo
            echo '# cargo test --workspace'
            cargo test --workspace 2>&1 || true
            echo
            echo '# tail: every suite of cargo test --workspace'
            grep -E '^(test result|error|failures:)' -c /dev/null 2>/dev/null || true
          } > ci-report.txt
      - name: Format and commit it back
        run: |
          cargo fmt
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ci: formatted the tree and wrote the checks report"
          git checkout -B "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

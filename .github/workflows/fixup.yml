name: fixup

# Temporary: formats the tree the way `cargo fmt` wants it and writes the checks' own output to `ci-report.txt`, both
# committed back to the branch. A push that touches this file runs it again. It exists because the machine that writes this branch cannot run cargo (no Rust
# toolchain, no crates.io), so this is how it reads what the checks say. Delete this file and `ci-report.txt` once the
# branch is green.

on:
  push:
    paths:
      - .github/workflows/fixup.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/content-build
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: Checks, into ci-report.txt
        run: |
          set +e
          {
            echo '# cargo fmt --check'
            cargo fmt --check 2>&1 | head -600
            echo
            echo '# cargo clippy --workspace --all-targets -- -D warnings'
            cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tail -600
            echo
            echo '# cargo test --workspace'
            cargo test --workspace 2>&1 | tail -600
          } > ci-report.txt
          # Apply the formatting here, so the branch is what `cargo fmt` produces (as CI checks it; `--all` would reach
          # into the excluded `vendor/` tree, which is not ours to reformat).
          cargo fmt
          exit 0
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The checkout is a detached HEAD: name the branch again, and push to it by name.
          git checkout -B "$GITHUB_REF_NAME"
          git add -A
          git commit -m 'ci: formatted the tree and wrote the checks report'
          git push origin "HEAD:$GITHUB_REF_NAME"

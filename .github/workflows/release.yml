name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14
  BINARYEN_VERSION: version_133

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          dir=honeydew-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir "$dir"
          bin=target/${{ matrix.target }}/release
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          cp "$bin/honeydew-native$ext" "$bin/honeydew-import$ext" README.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = Linux ]; then
            cp -R assets/linux tools/install-desktop-entry.sh "$dir/"
            tar czf "$dir.tar.gz" "$dir"
          elif [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: honeydew-*.*z*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Trunk and wasm-opt
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" >> "$GITHUB_ENV"
      - run: tools/web-dist.sh --zip
      - uses: softprops/action-gh-release@v2
        with:
          files: target/honeydew-web-*.zip
